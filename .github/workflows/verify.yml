name: Verify Beter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beter_test
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          BETER_DATA_DIR: .data/ci
